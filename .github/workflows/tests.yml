name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Cache NESO demand data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: neso-demand-2019-2024-v1

      - name: Download NESO demand data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python -m src.download

      - name: Lint
        run: ruff check src tests

      - name: Run tests with coverage
        run: pytest tests/ -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artefact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
